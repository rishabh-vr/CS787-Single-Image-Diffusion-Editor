# Chosen by eye from the candidate contact sheets (scripts/prepare_ood.py candidates); only
# public-domain / CC0 / CC BY / CC BY-SA files are accepted by the build step. The manifest
# data/manifests/ood_setA.csv records author, licence and source page for every image
# (CC BY / BY-SA need attribution). Images are at most 256 px on the long side (plan §4.3).
#   mode fit   the whole picture, long side 256 px
