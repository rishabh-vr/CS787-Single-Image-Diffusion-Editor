[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sidx"
version = "0.1.0"
description = "CS787 project: reproduction and OOD study of training-free single-image diffusion (Qiu et al., 2026)"
requires-python = ">=3.10"
# Runtime deps are installed per environment (env/requirements-*.txt); torch comes from Colab or the local install.
dependencies = ["numpy", "pillow", "pyyaml", "omegaconf>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
